<article class="card" [class.wide]="wide">
    <div class="panel" [style.background]="panel || null">
        @if (imgPath) {
            <img [src]="imgPath" [alt]="title" loading="lazy" [class.icon]="icon" [style.max-width]="icon ? null : logoWidth">
        }
    </div>

    <div class="body">
        <div class="title-row">
            <h3>{{ title }}</h3>
            @if (status) {
                <span class="status">{{ status }}</span>
            }
        </div>

        <p class="desc">{{ description }}</p>

        @if (code) {
            <pre class="code"><code>{{ code }}</code></pre>
        }

        @if (note) {
            <p class="note">{{ note }}</p>
        }

        @if (tags.length) {
            <ul class="tags" [attr.aria-label]="tagsLabel">
                @for (tag of tags; track tag) {
                    <li>{{ tag }}</li>
                }
            </ul>
        }

        <div class="footer">
            @if (url) {
                <a [href]="url" target="_blank" rel="noopener">
                    {{ linkLabel }}
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            } @else {
                <span class="private">{{ privateLabel }}</span>
            }
        </div>
    </div>
</article>
