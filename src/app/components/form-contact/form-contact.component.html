@let f = i18n.t().form;
<form
    action="https://formsquash.io/f/XNv5bVqIb9AcpKZKCRKc"
    method="POST"
    id="contactForm"
    [formGroup]="contactForm"
    class="form-contact"
    (ngSubmit)="onSubmit()"
>
  <label>
    {{ f.name }}
    <input type="text" formControlName="name" name="name" [placeholder]="f.namePh" autocomplete="name">
    @if (contactForm.get('name')?.touched) {
      @if (contactForm.get('name')?.hasError('required')) {
        <small>{{ f.nameRequired }}</small>
      } @else if (contactForm.get('name')?.hasError('minlength')) {
        <small>{{ f.nameMin }}</small>
      }
    }
  </label>

  <label>
    {{ f.email }}
    <input type="email" formControlName="email" name="email" [placeholder]="f.emailPh" autocomplete="email">
    @if (contactForm.get('email')?.touched) {
      @if (contactForm.get('email')?.hasError('required')) {
        <small>{{ f.emailRequired }}</small>
      } @else if (contactForm.get('email')?.hasError('email')) {
        <small>{{ f.emailInvalid }}</small>
      }
    }
  </label>

  <label>
    {{ f.phone }}
    <input type="tel" formControlName="phone" name="phone" placeholder="(99) 99999-9999" autocomplete="tel">
    @if (contactForm.get('phone')?.touched) {
      @if (contactForm.get('phone')?.hasError('required')) {
        <small>{{ f.phoneRequired }}</small>
      } @else if (contactForm.get('phone')?.hasError('pattern')) {
        <small>{{ f.phoneInvalid }}</small>
      }
    }
  </label>

  <label>
    {{ f.company }}
    <input type="text" formControlName="company" name="company" [placeholder]="f.companyPh" autocomplete="organization">
  </label>

  <input type="hidden" name="_gotcha">
  <button type="submit">{{ f.submit }}</button>
</form>
